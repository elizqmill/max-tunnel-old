name: Build Android Go Client

on:
  push:
    paths:
      - 'app/src/main/assets/android-client/**'
      - '.github/workflows/build-android-client.yml'
  workflow_dispatch:

env:
  NDK_HOME: /tmp/android-ndk

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            goarch: arm64
            cc: aarch64-linux-android21-clang
          - arch: arm
            goarch: arm
            cc: armv7a-linux-androideabi21-clang
          - arch: x86_64
            goarch: amd64
            cc: x86_64-linux-android21-clang
          - arch: x86
            goarch: 386
            cc: i686-linux-android21-clang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install NDK
        run: |
          NDK_ZIP=android-ndk-r27c-linux.zip
          curl -fsSL -o /tmp/$NDK_ZIP https://dl.google.com/android/repository/$NDK_ZIP
          unzip -q /tmp/$NDK_ZIP -d /tmp
          mv /tmp/android-ndk-r27c ${{ env.NDK_HOME }}

      - name: go mod tidy
        run: |
          cd app/src/main/assets/android-client
          go mod tidy

      - name: Build libclient.so (${{ matrix.arch }})
        run: |
          export CC=${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}
          cd app/src/main/assets/android-client
          CGO_ENABLED=1 GOOS=android GOARCH=${{ matrix.goarch }} \
            go build -buildmode=c-shared -ldflags="-s -w -checklinkname=0" \
            -o libclient-${{ matrix.arch }}.so .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libclient-${{ matrix.arch }}
          path: app/src/main/assets/android-client/libclient-${{ matrix.arch }}.so

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Merge into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs
          for arch in arm64 arm x86_64 x86; do
            mkdir -p app/src/main/jniLibs/$arch
            cp libclient-$arch/libclient-$arch.so app/src/main/jniLibs/$arch/libclient.so
          done
      - name: Upload merged jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs
