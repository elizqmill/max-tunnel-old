name: Build Android Go Client

on:
  push:
    paths:
      - 'app/src/main/assets/android-client/**'
      - '.github/workflows/build-android-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            goarch: arm64
            cc: aarch64-linux-android21-clang
          - arch: arm
            goarch: arm
            cc: armv7a-linux-androideabi21-clang
          - arch: x86_64
            goarch: amd64
            cc: x86_64-linux-android21-clang
          - arch: x86
            goarch: 386
            cc: i686-linux-android21-clang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install NDK
        run: |
          SDK_URL=https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          curl -fsSL -o /tmp/ndk.zip $SDK_URL
          unzip -q /tmp/ndk.zip -d /tmp
          mv /tmp/android-ndk-r27c /tmp/ndk
          echo "ANDROID_NDK_HOME=/tmp/ndk" >> $GITHUB_ENV

      - name: Setup cross-compiler
        run: |
          echo "CC_arm64=/tmp/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_arm=/tmp/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "CC_x86_64=/tmp/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_x86=/tmp/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang" >> $GITHUB_ENV

      - name: Build libclient.so (${{ matrix.arch }})
        run: |
          cd app/src/main/assets/android-client
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=${{ matrix.goarch }} \
          CC="${{ env[format('CC_{0}', matrix.arch)] }}" \
          go build -buildmode=c-shared -ldflags="-s -w" \
            -o libclient-${{ matrix.arch }}.so .
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libclient-${{ matrix.arch }}
          path: app/src/main/assets/android-client/libclient-${{ matrix.arch }}.so

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Merge into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs
          for arch in arm64 arm x86_64 x86; do
            mkdir -p app/src/main/jniLibs/$arch
            cp libclient-$arch/libclient-$arch.so app/src/main/jniLibs/$arch/libclient.so
          done
      - name: Upload merged jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs
